  # Endpoints de Comentarios
  /comment/{productPublicId}:
    post:
      tags:
        - comment
      summary: Crear un comentario en un producto
      operationId: createComment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: productPublicId
          in: path
          description: Identificador público del producto con los comentarios.
          required: true
          schema:
            type: string
            format: uuid
            example: "9d5eae04-99fb-4dfb-a171-b1f623fa0748"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentDTO"
      responses:
        '201':
          description: Comentario creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDTO"

    get:
      tags:
        - comment
      summary: Obtener comentario del usuario en un producto
      operationId: getUserCommentInProduct
      security:
        - bearerAuth: [ ]
      parameters:
        - name: productPublicId
          in: path
          description: Identificador público del producto con los comentarios.
          required: true
          schema:
            type: string
            format: uuid
            example: "9d5eae04-99fb-4dfb-a171-b1f623fa0748"
      responses:
        '200':
          description: Comentario del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDTO"

    put:
      tags:
        - comment
      summary: Actualizar un comentario de álbum
      operationId: updateAlbumComment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: productPublicId
          in: path
          description: Identificador público del producto con los comentarios.
          required: true
          schema:
            type: string
            format: uuid
            example: "dd859bd3-b938-462f-b340-6d0a6ecd7887"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentDTO"
      responses:
        '200':
          description: Comentario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDTO"

    delete:
      tags:
        - comment
      summary: Eliminar un comentario. Requiere un JWT válido o rol de administrador.
      operationId: deleteComment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: productPublicId
          in: path
          description: Identificador público del producto con los comentarios.
          required: true
          schema:
            type: string
            format: uuid
            example: "9d5eae04-99fb-4dfb-a171-b1f623fa0748"
      responses:
        '204':
          description: Comentario eliminado exitosamente
          content:
            application/txt:
              schema:
                type: string
                example: "Comentario eliminado exitosamente"

  /comment/public/{productPublicId}:
    get:
      tags:
        - comment
      summary: Obtener comentarios de un producto filtrados. Este endpoint puede solicitarse sin JWT por clientes autorizados.
      operationId: getByProductIdFiltered
      parameters:
        - name: productPublicId
          in: path
          required: true
          description: Identificador público del producto
          schema:
            type: string
            format: uuid
            example: "02287450-3529-45c7-a7e0-e8d885366650"
        - name: size
          in: query
          required: false
          description: Tamaño de la página a retornar.
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          required: false
          description: Índice de la página a retornar.
          schema:
            type: integer
            default: 0
        - name: from
          in: query
          required: false
          description: Fecha del primer comentario retornado.
          schema:
            type: string
            format: date
            example: "11-09-2025"
        - name: to
          in: query
          required: false
          description: Fecha del último comentario retornado.
          schema:
            type: string
            format: date
            example: "11-10-2025"

      responses:
        '200':
          description: Lista de comentarios del producto
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommentDTO"
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  size:
                    type: integer
                  number:
                    type: integer